{% extends "base.html" %} {% block title %} Add Book {% endblock %} {% block content %}

<div class="container">
    <h2>Add Book</h2>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="mb-3">
            <label class="form-label"> Accession No </label>

            <input type="text" name="accession_no" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label"> Book Name </label>

            <input type="text" name="book_name" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label"> Author </label>

            <input
                type="text"
                name="author"
                class="form-control"
                required
                placeholder=" Enter Author name"
            />
        </div>

        <div class="mb-3">
            <label class="form-label"> Publisher </label>

            <input
                type="text"
                name="publisher"
                class="form-control"
                placeholder="Enter publisher name"
            />
        </div>

        <div class="mb-3">
            <label class="form-label"> Category </label>

            <input type="text" name="category" class="form-control" />
        </div>

        <button type="submit" class="btn btn-success">Save</button>

        <a href="{{ url_for('book.books') }}" class="btn btn-secondary"> Back </a>
    </form>
</div>

{% endblock %}
