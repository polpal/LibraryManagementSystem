{% extends "base.html" %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="row justify-content-center">

```
<div class="col-md-8 col-lg-6">

    <div class="card shadow-sm">

        <div class="card-header d-flex justify-content-between align-items-center">

            <h4 class="mb-0">
                My Profile
            </h4>

            <a
                href="{{ url_for('profile.edit_profile') }}"
                class="btn btn-primary btn-sm"
            >
                Edit Profile
            </a>

        </div>

        <div class="card-body">

            <table class="table table-bordered mb-3">

                <tr>
                    <th width="35%">Username</th>
                    <td>{{ user.username }}</td>
                </tr>

                <tr>
                    <th>Email</th>
                    <td>{{ user.email }}</td>
                </tr>

                <tr>
                    <th>Phone</th>
                    <td>{{ user.phone }}</td>
                </tr>

                <tr>
                    <th>Role</th>
                    <td>{{ user.role }}</td>
                </tr>

                <tr>
                    <th>Status</th>
                    <td>{{ user.status }}</td>
                </tr>

            </table>

            <a
                href="{{ url_for('profile.change_password') }}"
                class="btn btn-warning"
            >
                Change Password
            </a>

        </div>

    </div>

</div>
```

</div>

{% endblock %}
